<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#161a33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1000" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <circle cx="140" cy="60" r="190" fill="url(#glow1)">
      <animate attributeName="cx" values="140;260;140" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;110;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="260" r="200" fill="url(#glow2)">
      <animate attributeName="cx" values="880;760;880" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;200;260" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="19.5" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="52" y="96" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" fill="#8b93b5">hi, i'm</text>
  <text x="52" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#name)">Marah</text>
  <text x="52" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#name)">Al-Naimat</text>
  <text x="52" y="256" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" fill="#c7cbe6">Junior Full-Stack Developer</text>
  <rect x="340" y="241" width="9" height="19" fill="#22d3ee">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g>
    <rect x="530" y="40" width="420" height="230" rx="14" fill="#0b0e1a" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="556" cy="64" r="6" fill="#ff5f57"/>
    <circle cx="576" cy="64" r="6" fill="#febc2e"/>
    <circle cx="596" cy="64" r="6" fill="#28c840"/>
    <text x="930" y="68" text-anchor="end" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#5d6486">marah.js</text>
    <line x1="530" y1="84" x2="950" y2="84" stroke="#ffffff" stroke-opacity="0.07"/>

    <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16">
      <text x="556" y="126" opacity="0"><tspan fill="#c792ea">const</tspan><tspan fill="#e6e9ff"> marah </tspan><tspan fill="#89ddff">=</tspan><tspan fill="#e6e9ff"> {</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="580" y="152" opacity="0"><tspan fill="#a6accd">role: </tspan><tspan fill="#c3e88d">"Full-Stack Dev"</tspan><tspan fill="#e6e9ff">,</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="580" y="178" opacity="0"><tspan fill="#a6accd">stack: </tspan><tspan fill="#e6e9ff">[</tspan><tspan fill="#c3e88d">"C#"</tspan><tspan fill="#e6e9ff">, </tspan><tspan fill="#c3e88d">".NET"</tspan><tspan fill="#e6e9ff">, </tspan><tspan fill="#c3e88d">"React"</tspan><tspan fill="#e6e9ff">],</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="580" y="204" opacity="0"><tspan fill="#a6accd">city: </tspan><tspan fill="#c3e88d">"Amman"</tspan><tspan fill="#e6e9ff">,</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.4s" fill="freeze"/>
      </text>
      <text x="580" y="230" opacity="0"><tspan fill="#a6accd">openToWork: </tspan><tspan fill="#f78c6c">true</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.4s" fill="freeze"/>
      </text>
    </g>
    <text x="556" y="256" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="16" fill="#e6e9ff" opacity="0">};
      <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.4s" fill="freeze"/>
    </text>
  </g>
</svg>
